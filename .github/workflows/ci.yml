name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  codecov-yaml-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check codecov.yml
        run: curl -v -X POST --fail-with-body --data-binary @codecov.yml https://codecov.io/validate

  format-check:
    strategy:
      matrix:
        os: [ 'macos-26' ]
        xcode-version: [ '26.4.1' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache SwiftPM build artifacts used to build swift-format.
      - uses: actions/cache@v6
        with:
          path: |
            **/.build
          key: format-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '.github/workflows/ci.yml') }}
          restore-keys: |
            format-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s '/Applications/Xcode_${{ matrix.xcode-version }}.app/Contents/Developer'

      - name: Build swift-format
        run: swift build -c release --product swift-format

      - name: Run swift-format and check
        run: |
          .build/release/swift-format -r BrewCoffee46 BrewCoffee46Tests BrewCoffee46Core BrewCoffee46WatchKitApp BrewCoffee46Widgets -i
          if [[ -n `git diff` ]]; then
            exit 1;
          fi

  build-and-test:
    strategy:
      matrix:
        os: [ 'macos-26' ]
        xcode-version: [ '26.4' ]
        ios-version: [ '26.4.1' ]
        ios-device-name: [ 'iPhone 17' ]
    runs-on: ${{ matrix.os }}
    env:
      DERIVED_DATA_PATH: Build
      LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.LICENSE_PLIST_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache SwiftPM build artifacts for CLI tools such as XcodeGen and
      # LicensePlist, plus the generated Settings.bundle. Xcode `DerivedData is
      # cached separately by irgaly/xcode-cache below.
      - uses: actions/cache@v6
        with:
          path: |
            **/.build
            BrewCoffee46/Settings.bundle
          key: ci-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '.github/workflows/ci.yml') }}
          restore-keys: |
            ci-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s '/Applications/Xcode_${{ matrix.xcode-version }}.app/Contents/Developer'

      - name: Build xcodegen
        run: swift build -c release --product xcodegen

      - name: Generate xcodeproj using xcodegen
        run:  .build/release/xcodegen generate

      - name: Restore Xcode build cache
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          key: xcode-deriveddata-${{ runner.os }}-xcode-${{ matrix.xcode-version }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-xcode-${{ matrix.xcode-version }}-${{ github.workflow }}-
          deriveddata-directory: ${{ env.DERIVED_DATA_PATH }}
          sourcepackages-directory: ${{ env.DERIVED_DATA_PATH }}/SourcePackages
          swiftpm-package-resolved-file: BrewCoffee46.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          restore-mtime-targets: |
            project.yml
            BrewCoffee46.xcodeproj/**/*

      - name: Test for core
        run: |
          set -o pipefail
          xcodebuild \
            -project BrewCoffee46.xcodeproj \
            -scheme BrewCoffee46CoreTests \
            -destination "platform=iOS Simulator,OS=${{ matrix.ios-version }},name=${{ matrix.ios-device-name }}" \
            -enableCodeCoverage YES \
            -showBuildTimingSummary \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            test | xcbeautify
          ./.github/workflows/convert.sh "$DERIVED_DATA_PATH" BrewCoffee46Core.o brewCoffee46_core.lcov

      - name: Test for iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project BrewCoffee46.xcodeproj \
            -scheme brewcoffee46 \
            -destination "platform=iOS Simulator,OS=${{ matrix.ios-version }},name=${{ matrix.ios-device-name }}" \
            -enableCodeCoverage YES \
            -showBuildTimingSummary \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            test | xcbeautify
          ./.github/workflows/convert.sh "$DERIVED_DATA_PATH" BrewCoffee46.app/BrewCoffee46.debug.dylib brewCoffee46.lcov

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
